[pytest]
testpaths    = tests
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -q
filterwarnings =
    ignore::DeprecationWarning:speech_recognition.*
    ignore::DeprecationWarning:feedparser.*

# Custom markers — avoids PytestUnknownMarkWarning
markers =
    slow:       mark a test as slow (may require live server)
    integration: mark as an integration test (needs running backend)
    unit:        mark as a fast unit test

# Show 10 slowest tests at end of run
# addopts += --durations=10   (uncomment when needed)
